[accessibility]
ui_scale = 0.90000000596046448

[audio]
sound_volume = 0.30999999307096004

[bar.default]
center = [ "clock", "settings" ]
end = [ "tray", "bar", "screenshot", "notifications", "temp", "volume", "session" ]
font_weight = 400
margin_ends = 180
padding = 41
position = "bottom"
scale = 0.90000000596046448
start = [ "control-center", "workspaces" ]
thickness = 24
widget_spacing = 8

[config]

[control_center]
hidden_tabs = [ "power", "bluetooth" ]

[location]
address = "Örebro"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "raycursive/discord-voice" ]

[shell]
corner_radius_scale = 0.20000000298023224
font_family = "MesloLGL Nerd Font"

    [shell.animation]
    speed = 1.4000000208616257

    [shell.launcher]
    categories = false
    default_view = "all"
    layout = "simple"
    session_search = true

        [shell.launcher.providers.calculator]
        global = true

    [shell.panel]
    borders = false

[templates]

[theme]
builtin = "Ayu"
community_palette = "ADW"
custom_palette = "gruvbox-2-mo"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "niri", "qt" ]

[wallpaper.default]
path = "/home/isakh/Pictures/Wallpapers/wp12329546-nixos-wallpapers.jpg"

[wallpaper.last]
path = "/home/isakh/Pictures/Wallpapers/wp12329546-nixos-wallpapers.jpg"

[wallpaper.monitors.DP-1]
path = "/home/isakh/Pictures/Wallpapers/wp12329546-nixos-wallpapers.jpg"

[widget.bar]
hide_when_disconnected = true
show_channel_name = false
type = "raycursive/discord-voice:bar"

[widget.control-center]
custom_image = "/nix/store/shwzw5jpl85nmy4d93nsk6mwj292d1di-noctalia-5.0.0/share/noctalia/assets/images/distros/nixos.svg"
custom_image_colorize = true

[widget.temp]
capsule = true
display = "text"
scale = 0.85000000000000009
stat = "cpu_usage"

[widget.workspaces]
active_pill_size = 1.0
capsule_radius = 1
